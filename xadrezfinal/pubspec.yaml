name: xadrez_app
description: Chess.com App - trabalho final de Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.7
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  geolocator: ^14.0.0
  table_calendar: ^3.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icons/chess_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/chess_icon.png
  adaptive_icon_background: '#312E2B'
  adaptive_icon_foreground: assets/icons/chess_icon.png

flutter_native_splash:
  color: '#312E2B'
  image: assets/icons/chess_icon.png
  android: true
  ios: false
  android_12:
    color: '#312E2B'
    image: assets/icons/chess_icon.png
